<!--
  favicon —— 与首页 header 的 logo 保持同一造型（见 home.vue 的 .logo-icon）。

  与 header 版本的唯一差异：那边用 currentColor / var(--bg-base) 跟随主题，
  而 favicon 独立渲染在浏览器标签里，取不到页面的 CSS 变量，故颜色写死：
    主体 = #4a9eff（应用强调色·青蓝）
    眼睛 = #0f1419（暗色背景色，在浅色标签栏上同样清晰）
  ⚠️ 改 logo 造型时，此文件与 home.vue 的 .logo-icon 需同步。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 身体 -->
  <ellipse cx="50" cy="60" rx="35" ry="30" fill="#4a9eff"/>
  <!-- 肚子：半透明叠加形成层次 -->
  <ellipse cx="50" cy="65" rx="22" ry="20" fill="#4a9eff" opacity="0.45"/>
  <!-- 头 -->
  <circle cx="50" cy="32" r="18" fill="#4a9eff"/>
  <!-- 眼睛 -->
  <circle cx="44" cy="29" r="5" fill="#0f1419"/>
  <circle cx="56" cy="29" r="5" fill="#0f1419"/>
  <!-- 鸡冠 -->
  <path d="M38 22 Q42 8 46 20 Q48 6 52 20 Q56 8 60 22" fill="#4a9eff"/>
  <!-- 翅膀 -->
  <ellipse cx="30" cy="58" rx="14" ry="10" fill="#4a9eff" opacity="0.7" transform="rotate(-15 30 58)"/>
</svg>
