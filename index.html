<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="基攻宝 - 基金实时估值系统（多 Worker 并发版）" />
    <!-- 入口 HTML 缓存控制：meta 作为第二道防线（GitHub Pages 返回的 HTTP 响应头优先级更高，
         meta 在部分浏览器/CDN 不可靠）。主防线是 version-checker：运行时 fetch version.json?v=<时间戳>
         绕过缓存取线上最新版本，与当前运行的 __APP_VERSION__ 不一致即 location.reload()，
         确保部署后老用户自动刷到新版（无需 Ctrl+Shift+R）。见 src/shared/version/version-checker.ts。 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- 浏览器标签 favicon：与 app 首页 header logo 同一 SVG（public/favicon.svg），
         Vite 构建时 href 自动加 base 前缀（/real-time-valuation/favicon.svg）。
         iOS 不认 SVG 的 apple-touch-icon，必须给 PNG，否则主屏图标退化成
         灰底截图 + 首字母；且 iOS 不支持透明通道，PNG 需自带不透明底色。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="基攻宝" />
    <title>基攻宝</title>
    <script>
      // 防止主题闪烁（FOUC）：渲染前读取用户偏好设 class，默认深色。
      // v3.0 移除了 pure-white 主题：老用户存的 'pure-white' 在此归一到 light，
      // 与 settings-store 的迁移逻辑保持一致（否则会挂上无 CSS 的 class）。
      (function() {
        try {
          var settings = JSON.parse(localStorage.getItem('jgb_user_settings'));
          var t = settings && settings.theme;
          document.documentElement.classList.add(
            (t === 'light' || t === 'pure-white') ? 'light' : 'dark'
          );
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', (t === 'light' || t === 'pure-white') ? '#ffffff' : '#0f1419');
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="app">
      <div id="vue-fallback" style="color:#94a3b8;padding:24px;text-align:center;font-size:14px;">正在加载...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
