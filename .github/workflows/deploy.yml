name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. 安装并设置稳定的 pnpm 引擎（避开 npm 的底层崩溃 Bug）
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      # 2. 使用 pnpm 安装全部项目依赖
      - run: pnpm install

      # 3. 执行打包命令（Vite/Vue-tsc 将正常运行）
      - run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
